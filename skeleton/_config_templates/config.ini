PRIMARY_DOMAIN=example.com
ADMIN_DOMAIN=admin.example.com
ENFORCE_HTTPS=false
WEB_ROOT=/var/www/html/example.com/www

[subdomain]
ACCEPTED_SUBDOMAINS=

[dev]
DEV_SUBNET="192.168.1."

[mail]
; Address mail is sent from; blank means noreply@ + PRIMARY_DOMAIN.
MAIL_FROM=
; A folder (absolute, or relative to the site root). When set, mail is written
; there as .eml files and nothing is sent. Blank sends mail. The files hold live
; sign-in links: the folder is created 0700 and each file 0600.
MAIL_CAPTURE_DIR=
FROM_EMAIL="admin@example.com"
NOTIFY_EMAIL="you@example.com"
