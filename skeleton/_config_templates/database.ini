PASS=
HOST=localhost
USER=
NAME=

; --- Driver settings (all optional) ---
; Leaving these blank/absent reproduces the historical mysql behaviour exactly.

; PDO driver: mysql | pgsql | sqlite. Defaults to mysql when blank.
; For sqlite, NAME is the file path (or :memory:) and HOST/USER/PASS are ignored.
DB_DRIVER=mysql

; Blank uses the driver's own default port (3306 mysql, 5432 pgsql).
DB_PORT=

; Client encoding. Blank means utf8mb4 on mysql and the server default on pgsql.
; On pgsql a value here becomes options='--client_encoding=...', so use PG
; encoding names (UTF8) rather than mysql ones (utf8mb4).
DB_CHARSET=
