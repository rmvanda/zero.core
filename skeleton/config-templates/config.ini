PRIMARY_DOMAIN=example.com
ADMIN_DOMAIN=admin.example.com
ENFORCE_HTTPS=false

; Path prefix for log files. core/bin/log_monitor.sh appends "_<LEVEL>.log",
; so /var/log/zero/example becomes /var/log/zero/example_ERROR.log etc.
;LOG_FILE=/var/log/zero/example

; Filesystem root of the public web directory, no trailing slash.
WEB_ROOT=/var/www/html/example.com/www

[subdomain]
; Comma-separated list of subdomains the router will accept, e.g. "poker,blog".
; Blank means no subdomains are accepted.
ACCEPTED_SUBDOMAINS=

[dev]
; DEVMODE turns on when REMOTE_ADDR contains this string (core/Application.php).
; It is a substring match, not CIDR — "192.168.1." matches 192.168.1.*
DEV_SUBNET="192.168.1."

[mail]
; Address mail is sent from; blank means noreply@ + PRIMARY_DOMAIN.
MAIL_FROM=
; A folder (absolute, or relative to the site root). When set, mail is written
; there as .eml files and nothing is sent. Blank sends mail. The files hold live
; sign-in links: the folder is created 0700 and each file 0600.
MAIL_CAPTURE_DIR=
NOTIFY_EMAIL="you@example.com"
