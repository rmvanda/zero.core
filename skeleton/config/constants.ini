; Default core reads when a site has no app/config/constants.ini. DEVMODE turns on when REMOTE_ADDR contains this string; a hyphen never occurs in an address, so with this default no visitor gets development mode.
DEV_SUBNET=-

; Name of the "returning user" hint cookie (default: zero_user_id). See Session::hintCookieName().
;SESSION_HINT_COOKIE=""
