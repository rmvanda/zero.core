; User's wording defaults (see core/modules/Module/strings/example.ini for the quoting rules).
; A constant that names the site holds a %s where the site's name goes; the view
; fills it with Strings::fill(), passing SITE_SHORT_NAME. Every other percent sign is literal.

; Sign-in page heading. %s = site name
USER_LOGIN_HEADING="Sign in to %s"
; The sentence under the sign-in form, then the privacy line. The view links the
; last word(s) of the privacy line (USER_LOGIN_PRIVACY_LINK) to /privacy.
USER_LOGIN_BLURB="Signing in gives you access to more neat things."
USER_LOGIN_PRIVACY="Read the privacy policy"
USER_LOGIN_PRIVACY_LINK="here"
