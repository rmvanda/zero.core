; Admin's wording defaults (see core/modules/Module/strings/example.ini for the quoting rules).
; Sentences a site might reword; plain labels stay in the views.

; The paragraph under the heading of the modules screen
ADMIN_MODULES_INTRO="A module that is off answers 404 everywhere. Only changes from a module's default are written to app/modules.ini. A lower order number puts a module's admin card earlier."
; Shown instead of a switch for a module that cannot be turned off
ADMIN_MODULES_ALWAYS_ON="Always on"
; Shown after a change is saved
ADMIN_MODULES_SAVED="Saved. The change applies from the next request."
; Shown after the error text when the file changed after the screen was drawn
ADMIN_MODULES_RELOAD_HINT="Someone else changed the modules in the meantime. Reload the page and make the change again."
; Shown beside a module whose name is an INI keyword (On, Off, Yes, No, True, False, None, Null) and so cannot be a key
ADMIN_MODULES_UNSETTABLE="Its name cannot be set from app/modules.ini."
