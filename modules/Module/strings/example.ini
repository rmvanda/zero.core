; Wording this module ships as defaults. Every .ini in strings/ is read with
; INI_SCANNER_RAW and each key becomes a constant, defined only if the site's
; app/strings/*.ini has not already defined it. Prefix every key with the
; module's name in upper snake case.
;
; Writing a value: wrap the WHOLE value in double quotes. Inside the quotes
; the text is literal: a single quote ('), =, ; and further double quotes
; ("hi") need no escaping and a backslash is a backslash. Without the quotes
; a ; starts a comment and leading or trailing spaces are dropped.
;
;   EXAMPLE_NOTE="We'll email you a link; it says "hi" = done."
MODULE_EXAMPLE_STRING="Hello from the Module skeleton."
