; Auth's wording defaults (see core/modules/Module/strings/example.ini for the quoting rules).
; A constant that names the site holds a %s where the site's name goes; the view
; or controller fills it with Strings::fill(), passing SITE_SHORT_NAME. Every other
; percent sign is literal.

; A paragraph the emails wrap over two lines is two constants (..._IGNORE and
; ..._IGNORE_REST, ..._EXPIRY and ..._IGNORE); the email shows them one after
; the other, so a site rewording one rewords its partner too.

; Email subjects (plain text).
AUTH_EMAIL_VERIFY_SUBJECT="Confirm your email address"
; %s = site name
AUTH_EMAIL_LOGIN_SUBJECT="Your %s sign-in link"

; Sign-up confirmation email.
; %s = site name
AUTH_EMAIL_VERIFY_LEAD="Welcome to %s."
AUTH_EMAIL_VERIFY_INSTRUCTIONS="Click the link below to confirm this email address and finish signing up."
AUTH_EMAIL_VERIFY_EXPIRY="The link is good for 24 hours and can only be used once."
AUTH_EMAIL_VERIFY_LINK="Confirm my email address"
; %s = site name
AUTH_EMAIL_VERIFY_IGNORE="If you didn't sign up for %s, you can ignore this email — the address"
AUTH_EMAIL_VERIFY_IGNORE_REST="won't be used until someone clicks that link."

; Sign-in link email.
; %s = site name
AUTH_EMAIL_LOGIN_LEAD="Here's your sign-in link for %s."
; %s = site name
AUTH_EMAIL_LOGIN_LINK="Sign in to %s"
AUTH_EMAIL_LOGIN_EXPIRY="This link expires in 15 minutes and can only be used once. If you didn't"
AUTH_EMAIL_LOGIN_IGNORE="request it, you can ignore this email — nobody can sign in without clicking it."

; Shared by both emails.
AUTH_EMAIL_PASTE_LEAD="Or paste this into your browser:"

; Confirm-sign-in page. %s = site name
AUTH_TOKEN_CONFIRM_LEAD="Click below to finish signing in to %s."
